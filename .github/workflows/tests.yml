name: Tests

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  qml-tests:
    name: QML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The engine tests exercise pure JS (parsing and protocol conversion),
      # so they need the QML test runner but neither ossia/score nor a display.
      - name: Install Qt6 QML tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qttest

      - name: qmltestrunner (hard gate)
        run: |
          RUNNER=$(command -v qmltestrunner || echo /usr/lib/qt6/bin/qmltestrunner)
          QT_QPA_PLATFORM=offscreen "$RUNNER" -import qml -input tests/

      # Informational: the views import Score.UI, which only exists inside a
      # packaged ossia/score app, so unresolved-import noise is expected here.
      - name: qmllint
        continue-on-error: true
        run: |
          QMLLINT=$(command -v qmllint || echo /usr/lib/qt6/bin/qmllint)
          for f in qml/*.qml qml/spm/Views/*.qml qml/spm/Components/*.qml; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            QT_QPA_PLATFORM=offscreen "$QMLLINT" -I qml --unqualified info "$f" || true
            echo "::endgroup::"
          done
